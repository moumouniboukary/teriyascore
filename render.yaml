# Blueprint TeriyaScore — API + Postgres (séparé de NeoForma).
# Render → New → Blueprint → ce repo.
databases:
  - name: teriyascore-db
    databaseName: teriyascore
    user: teriyascore
    plan: free

services:
  - type: web
    name: teriyascore-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teriyascore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: BRAND_APP_NAME
        value: TeriyaScore
      - key: BRAND_PRIMARY_COLOR
        value: "#3D7EFF"
      - key: BRAND_SECONDARY_COLOR
        value: "#7AA8FF"
