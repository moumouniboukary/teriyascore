# Blueprint TeriyaScore — API Render uniquement.
# Postgres : Neon (gratuit), pas Render — 1 seule base free par compte,
# déjà utilisée par NeoForma. Ne jamais coller l’URL NeoForma ici.
# Après sync : coller DATABASE_URL Neon (pooled, sslmode=require).
services:
  - type: web
    name: teriyascore-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: BRAND_APP_NAME
        value: TeriyaScore
      - key: BRAND_PRIMARY_COLOR
        value: "#3D7EFF"
      - key: BRAND_SECONDARY_COLOR
        value: "#7AA8FF"
